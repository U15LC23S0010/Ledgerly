services:
  backend:
    build:
      context: ./backend
    container_name: ledgerly-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000/api/v1
    container_name: ledgerly-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend